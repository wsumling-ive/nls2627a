    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hk-slang-game';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        // Expose to global scope for the main script to use
        window.firebaseApp = initializeApp(firebaseConfig);
        window.db = getFirestore(window.firebaseApp);
        window.auth = getAuth(window.firebaseApp);
        window.appId = appId;

        // Auto-authenticate
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(window.auth, __initial_auth_token);
                } else {
                    await signInAnonymously(window.auth);
                }
                console.log("Firebase Auth Ready");
            } catch (error) {
                console.error("Auth error:", error);
            }
        };
        initAuth();
    </script>

                scenario: "聽完同學抱怨咗半個鐘頭Course registration（搶課）系統有幾廢，你總結：...",
                correct: "jat1 geoi3 gong2 saai3",
                options: ["yi1 geoi3 gong2 saai3", "jat1 geoi3 gong2 saai3", "jat1 jui3 gong2 saai3"],
                tip: "【意思：總而言之】『晒』(saai3) 在粵語中常作副詞，表示『全部、完畢』。"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];
        const BASE_SCORE = 100;
        
        // Timer mechanics
        let timerInterval;
        let timeLeft = 100; // Represents percentage (100% to 0%)
        const TIME_LIMIT_MS = 30000; // 30 seconds per question
        const TICK_RATE = 50;

        /* Voice settings */
        let hkVoices = [];
        function initVoices() {
            const voices = window.speechSynthesis.getVoices();
            hkVoices = voices.filter(v => v.lang === 'zh-HK' || v.lang === 'yue-Hant-HK' || v.lang.includes('HK'));
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            initVoices();
        }

        /* Helper Functions */
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function $(id) { return document.getElementById(id); }

        function showScreen(screenId) {
            ['screen-start', 'screen-game', 'modal-feedback', 'screen-end', 'screen-leaderboard'].forEach(id => {
                if(!$(id).classList.contains('hidden-screen')) {
                    $(id).classList.add('hidden-screen');
                    $(id).classList.remove('fade-enter-active', 'fade-enter');
                }
            });
            const el = $(screenId);
            el.classList.remove('hidden-screen');
            el.classList.add('fade-enter');
            setTimeout(() => el.classList.add('fade-enter-active'), 20);
        }

        window.startGame = function() {
            currentQuestionIndex = 0;
            score = 0;
            $('ui-score').innerText = score;
            shuffledQuestions = shuffleArray([...gameData]); 
            showScreen('screen-game');
            loadQuestion();
        }

        window.showStartScreen = function() { showScreen('screen-start'); }
        window.resetGame = function() { showStartScreen(); }

        function loadQuestion() {
            const q = shuffledQuestions[currentQuestionIndex];
            
            $('ui-question-count').innerText = `${currentQuestionIndex + 1} / ${shuffledQuestions.length}`;
            $('ui-scenario').innerText = q.scenario;
            $('ui-word').innerText = q.word;

            const optionsContainer = $('ui-options');
            optionsContainer.innerHTML = '';
            
            const shuffledOptions = shuffleArray([...q.options]);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "btn-option w-full py-4 px-6 text-[17px] text-left flex justify-between font-bold hover:bg-emerald-50";
                btn.innerHTML = `<span>${opt}</span> <span class="text-slate-400 text-sm">👈</span>`;
                btn.onclick = () => checkAnswer(opt, q);
                optionsContainer.appendChild(btn);
            });

            startTimer();
            // Automatically play voice when question loads to help learning
            // playCurrentAudio(); // Optional: uncomment if auto-play is desired
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 100;
            const timerBar = $('timer-bar');
            timerBar.style.width = '100%';
            timerBar.classList.remove('timer-warning');

            const decreaseAmount = 100 / (TIME_LIMIT_MS / TICK_RATE);

            timerInterval = setInterval(() => {
                timeLeft -= decreaseAmount;
                timerBar.style.width = `${Math.max(0, timeLeft)}%`;
                
                if (timeLeft < 30) {
                    timerBar.classList.add('timer-warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, TICK_RATE);
        }

        function handleTimeOut() {
            const q = shuffledQuestions[currentQuestionIndex];
            checkAnswer(null, q, true); // null option means timeout
        }

        window.speakCantonese = function(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.85; 
                
                if (hkVoices.length > 0) {
                    const femaleVoice = hkVoices.find(v => 
                        v.name.includes('Sin-ji') || v.name.includes('HiuMaan') || 
                        v.name.includes('Google') || v.name.includes('Mei-Jia')
                    );
                    utterance.voice = femaleVoice || hkVoices[0];
                }
                window.speechSynthesis.speak(utterance);
            }
        }

        window.playCurrentAudio = function() {
            const q = shuffledQuestions[currentQuestionIndex];
            speakCantonese(q.ttsWord || q.word);
        }

        function checkAnswer(selectedOption, questionData, isTimeout = false) {
            clearInterval(timerInterval);
            const isCorrect = selectedOption === questionData.correct;
            
            speakCantonese(questionData.ttsWord || questionData.word);

            let timeBonus = 0;
            if (isCorrect && !isTimeout) {
                // Calculate time bonus (max 50 points based on speed)
                timeBonus = Math.floor((timeLeft / 100) * 50);
                score += (BASE_SCORE + timeBonus);
                $('ui-score').innerText = score;
            }

            // Update UI modal
            const fbIcon = $('feedback-icon');
            const fbTitle = $('feedback-title');
            const fbWord = $('feedback-word');
            const fbAns = $('feedback-correct-ans');
            const fbTip = $('feedback-tip');
            const fbBonus = $('feedback-time-bonus');

            fbWord.innerText = questionData.word;
            fbAns.innerText = questionData.correct;
            fbTip.innerHTML = questionData.tip;
            fbBonus.innerText = timeBonus;

            if(isTimeout) {
                fbIcon.innerText = "⏰";
                fbTitle.innerText = "太慢啦！";
                fbTitle.className = "text-3xl font-black mb-1 text-orange-600";
            } else if(isCorrect) {
                fbIcon.innerText = "🎯";
                fbTitle.innerText = "識貨！(完全正確)";
                fbTitle.className = "text-3xl font-black mb-1 text-emerald-600";
            } else {
                fbIcon.innerText = "❌";
                fbTitle.innerText = "中伏啦！(受干擾)";
                fbTitle.className = "text-3xl font-black mb-1 text-red-600";
            }

            showScreen('modal-feedback');
        }

        window.nextQuestion = function() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                showScreen('screen-game');
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            $('ui-final-score').innerText = score;
            
            let rank = "";
            let maxBaseScore = shuffledQuestions.length * BASE_SCORE;
            let ratio = score / maxBaseScore; // Doesn't account for bonus, which is fine for rank

            if (ratio >= 1.2) {
                rank = "🌟 榮譽港漂 (神級語速)";
            } else if (ratio >= 0.9) {
                rank = "😎 地道Local (完全融入)";
            } else if (ratio >= 0.6) {
                rank = "🏃 努力適應中 (仲有進步空間)";
            } else {
                rank = "✈️ 剛落機 (小心行路唔帶眼)";
            }
            
            $('ui-rank').innerText = rank;
            
            // Reset saving UI
            $('save-status').classList.add('hidden');
            $('btn-save-score').disabled = false;
            $('btn-save-score').classList.remove('opacity-50');
            $('player-name').value = '';
            $('save-score-section').classList.remove('hidden');

            // Only show save option if score > 0
            if(score === 0) $('save-score-section').classList.add('hidden');

            showScreen('screen-end');
        }

        window.saveScore = async function() {
            if (!window.auth || !window.auth.currentUser) {
                alert("數據庫連線中，請稍候再試。");
                return;
            }

            const playerName = $('player-name').value.trim() || '神秘港漂';
            const btn = $('btn-save-score');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            btn.innerText = "上傳中...";

            try {
                // Rule 1: Strict Paths for public data
                const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'leaderboard');
                await addDoc(colRef, {
                    name: playerName.substring(0, 10), // limit length
                    score: score,
                    timestamp: Date.now()
                });
                
                $('save-status').classList.remove('hidden');
                btn.innerText = "已提交";
                
                // Jump to leaderboard after brief delay
                setTimeout(showLeaderboardScreen, 1000);
            } catch (error) {
                console.error("Error saving score: ", error);
                btn.innerText = "提交失敗";
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        window.showLeaderboardScreen = async function() {
            showScreen('screen-leaderboard');
            const listDiv = $('leaderboard-list');
            listDiv.innerHTML = '<div class="text-center text-slate-400 mt-10 animate-pulse">載入龍虎榜中...</div>';

            if (!window.auth || !window.auth.currentUser) {
                listDiv.innerHTML = '<div class="text-center text-red-400 mt-10">無法連線至伺服器</div>';
                return;
            }

            try {
                // Rule 1 & 2: Simple query, sort in memory if complex, but orderBy score is a simple index usually allowed if generated.
                // To be strictly safe per Rule 2 (No Complex Queries requiring indexes), we fetch and sort in memory.
                const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'leaderboard');
                const querySnapshot = await getDocs(colRef);
                
                let records = [];
                querySnapshot.forEach((doc) => {
                    records.push(doc.data());
                });

                // Sort descending in memory
                records.sort((a, b) => b.score - a.score);
                // Limit to top 100
                records = records.slice(0, 50);

                if (records.length === 0) {
                    listDiv.innerHTML = '<div class="text-center text-slate-400 mt-10">暫無記錄，快啲爭取第一名啦！</div>';
                    return;
                }

                let html = '';
                records.forEach((record, index) => {
                    let medal = '';
                    if (index === 0) medal = '🥇';
                    else if (index === 1) medal = '🥈';
                    else if (index === 2) medal = '🥉';
                    else medal = `<span class="text-slate-400 text-sm inline-block w-[20px]">${index+1}</span>`;

                    let rowClass = index % 2 === 0 ? 'bg-slate-50' : 'bg-white';
                    let textClass = index < 3 ? 'text-red-600 font-bold' : 'text-slate-700 font-bold';

                    html += `
                        <div class="flex justify-between items-center p-3 rounded-lg ${rowClass} mb-2 border border-slate-200">
                            <div class="flex items-center gap-3">
                                <div class="text-xl w-[30px] text-center">${medal}</div>
                                <div class="font-bold text-slate-800">${escapeHtml(record.name)}</div>
                            </div>
                            <div class="${textClass} text-xl">${record.score}</div>
                        </div>
                    `;
                });
                
                listDiv.innerHTML = html;

            } catch (error) {
                console.error("Error loading leaderboard: ", error);
                listDiv.innerHTML = '<div class="text-center text-red-400 mt-10">載入失敗，請稍後再試。</div>';
            }
        }

        // Prevent XSS in leaderboard names
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
